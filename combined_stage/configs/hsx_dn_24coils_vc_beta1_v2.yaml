# HSX 24 coils, beta 1 %, virtual casing -- v2 (2026-09-21), seeded from the tip-lift run dn_24coils_tiplift_vac
#   (vacuum, tip 0.100 -> >= 0.143). Run 911's blow-up on the unlifted seed does NOT reproduce (job 1053: VC sane there,
#   0.86 % of |B|; transient failure on 2026-09-17), but the lifted tip is the better seed either way.
#   B.n target 2.2e-3: the m <= 6 vacuum floor of this set (1.19e-3, job 871) x the 1.8 that m <= 8 + VC added for the
#   32-coil set (3.0e-4 -> 5.5e-4); the stall safeguard relaxes it if that is still too tight.
#   Per-block tolerances (eta0 / ctol mappings): B.n at its MEASURED floor for m <= 8 + virtual casing, pressure balance
#   and X-line 3e-4, boundary regularity 5e-3 (its natural scale; the single global 3e-4 in run 910 left that block's
#   multiplier at zero and let the tip slide below the 0.15 floor). Virtual-casing start-up gate in the driver.
