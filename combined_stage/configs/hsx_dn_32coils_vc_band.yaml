# HSX 32 coils, beta 1 %, virtual casing, B.n BAND (2026-09-22). Restarts from run v2a's OUTER 3 state (f_QS 0.023,
#   max|B.n harmonic| 8.3e-4, rms 1.95e-3) -- its best quasi-symmetry before the B.n equalities pulled it away.
#   consistency.bnormal_band 1.0e-3: every constrained B.n harmonic must stay in |h| <= 1e-3 (two inequality rows each)
#   instead of being driven to an unreachable zero. v2a and v2b met their B.n targets at outer 9 and then traded f_QS
#   0.024 -> 0.116 and 0.022 -> 0.21 for B.n the design did not need. Inside the band the B.n rows exert no force.
#   Tolerances per block: bnormal_band 1e-4 (violation beyond the band edge), pressure balance and X-line 3e-4,
#   boundary regularity 5e-3.
