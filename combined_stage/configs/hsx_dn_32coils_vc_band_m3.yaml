# HSX 32 coils, beta 1 %, virtual casing, B.n band 1e-3, MAX_MODE 3 (2026-09-23). Continues the band run's final
#   state (f_QS 0.0136, max|B.n harmonic| 1.01e-3 at the band edge, rms B.n/B 4.24e-3).
#   The band run improved quasi-symmetry monotonically but its total field error grew: every constrained harmonic may
#   sit at the band edge. With m, |n| <= 3 the boundary has 48 shape dofs instead of 24, so the optimizer can look for
#   shapes that are quasi-symmetric AND easy for these coils to produce -- i.e. move the trade-off itself rather than
#   pick a point on it. (max_mode 3 stalled on VMEX Jacobian failures in the pre-guard era; the boundary guard,
#   the regularity constraint and the band are all in place now.)
