# HSX 32 coils, beta 1 %, virtual casing -- B.n as EQUALITY + net poloidal current (Boozer G) condition + 32x32 grid
# (2026-09-28), PLUS self-consistent bootstrap current. Same seed as the band run 1300 (run v2a's OUTER 3: coils, X-line, boundary).
#   consistency.bnormal_band null: the coils must PRODUCE B_ext, (B_plasma + B_coil).n harmonics = 0 (m <= 8, |n| <= 9,
#     161 rows), stopping tolerance 1e-3 ("basically zero" for now; push lower later).
#   field_strength net_poloidal_current: oint B_coil.dl / mu0 = 2 pi G / mu0 (G = VMEX rbtor), exact at any beta, replaces
#     pressure_balance (|B_in|^2 at grid points). Converged at ns 16 (1.7e-6), gradient 6e-4 (jobs 2119, 2312).
#   vmex.nphi/ntheta 32x32: the 24x20 grid misread the B.n harmonics by up to 18 % (job 2119).
#   bootstrap: Redl <J.B> mismatch (6 surfaces) = 0 as an AL equality block; current profile free (AC(0..7) + CURTOR,
#     vmex.current_dofs 8). Kinetic profiles ne = 2e19 flat, Te = Ti = 1252.6 eV (1 - s): their pressure e ne (Te + Ti)
#     equals the seed's p0 (1 - s), p0 = 8027.5 Pa, so beta stays 0.93 %. Probe job 2305: -20.7 kA, edge iota 0.41 -> 0.58.
#     Seed namelist from tools/make_bootstrap_seed.py (Picard, fixed boundary). Boundary gradients of this block are ~1 %
#     accurate and piecewise smooth (hard grid max/min |B| in Redl's trapped fraction; jobs 2309/2310).
